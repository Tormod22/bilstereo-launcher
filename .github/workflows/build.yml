name: Bygg APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Bare ett bygg om gangen. Et nyere bygg venter til det eldre er ferdig (avbryter det ikke midt i
# opplastingen – da kunne «latest» fått APK fra ett bygg og version.json fra et annet)
concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android-verktøyene finnes allerede på GitHub sine maskiner (ANDROID_HOME). Det gamle
      # «setup-android»-steget feilet fordi det prøver å installere en utgått pakke («tools»).
      - name: Godta Android-lisenser
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Sett opp fast signatur
        env:
          KEYSTORE_BASE64: ${{ secrets.TOS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TOS_KEYSTORE_PASSWORD }}
          # Valgfri: bare hvis selve nøkkelen har et annet passord enn nøkkelfila
          KEY_PASSWORD: ${{ secrets.TOS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Mangler signeringsnøkkel::Legg inn TOS_KEYSTORE_BASE64 og TOS_KEYSTORE_PASSWORD under Settings → Secrets and variables → Actions → New repository secret. Verdiene står i tos-hemmeligheter.txt."
            exit 1
          fi
          # Tåler mellomrom/linjeskift fra innliming
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/tos.jks" || {
            echo "::error title=Ødelagt nøkkel::TOS_KEYSTORE_BASE64 er ikke gyldig. Kopier hele den lange teksten fra tos-hemmeligheter.txt på nytt."; exit 1; }
          PW="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          KP="$(printf '%s' "$KEY_PASSWORD" | tr -d ' \r\n\t')"
          [ -n "$KP" ] || KP="$PW"
          echo "::add-mask::$PW"
          echo "::add-mask::$KP"
          keytool -list -keystore "$RUNNER_TEMP/tos.jks" -storepass "$PW" -alias tos > /dev/null 2>&1 || {
            echo "::error title=Nøkkel og passord passer ikke::Sjekk at TOS_KEYSTORE_PASSWORD og TOS_KEYSTORE_BASE64 er kopiert riktig fra tos-hemmeligheter.txt."; exit 1; }
          # Sjekk selve nøkkelen også (ikke bare fila): certreq trenger den private nøkkelen og dermed nøkkelpassordet
          keytool -certreq -alias tos -keystore "$RUNNER_TEMP/tos.jks" -storepass "$PW" -keypass "$KP" -file "$RUNNER_TEMP/check.csr" > /dev/null 2>&1 || {
            echo "::error title=Nøkkelpassordet passer ikke::Nøkkelfila åpnes, men selve nøkkelen «tos» har et annet passord. Legg det inn som hemmeligheten TOS_KEY_PASSWORD."; exit 1; }
          rm -f "$RUNNER_TEMP/check.csr"
          echo "TOS_KEYSTORE=$RUNNER_TEMP/tos.jks" >> "$GITHUB_ENV"
          echo "TOS_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "TOS_KEY_PASSWORD=$KP" >> "$GITHUB_ENV"

      # Røyktestene (Robolectric) trenger en Android-kopi (~160 MB) fra Maven Central. Den lagres mellom byggene, og hentes
      # på forhånd med nye forsøk: Maven Central svarer av og til «429 – for mange forespørsler», og det skal ikke stoppe
      # oppdateringen. Brukes ny Robolectric-versjon, må navnet i «case» under oppdateres (ellers henter Robolectric selv).
      - name: Finn Robolectric-versjon
        id: robo
        run: |
          V="$(grep -oP 'org\.robolectric:robolectric:\K[0-9.]+' app/build.gradle.kts | head -1 || true)"
          case "$V" in
            4.13) A=13-robolectric-9030017-i6 ;;   # sdk 33 (@Config(sdk = [33]) i alle røyktestene)
            *) A="" ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "artifact=$A" >> "$GITHUB_OUTPUT"

      - name: Lagre Robolectric sin Android-kopi mellom byggene
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robo.outputs.version }}-${{ steps.robo.outputs.artifact }}

      - name: Hent Robolectric sin Android-kopi (med nye forsøk)
        if: steps.robo.outputs.artifact != ''
        env:
          A: ${{ steps.robo.outputs.artifact }}
        run: |
          F="android-all-instrumented-$A"
          D="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$A"
          if [ -s "$D/$F.jar" ]; then echo "Finnes allerede (fra lagringen)"; exit 0; fi
          B="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$A/$F"
          T="$(mktemp -d)"
          sha() { sha512sum "$1" | cut -d' ' -f1; }
          want() { tr -d ' \r\n' < "$1" | cut -c1-128; }
          for n in 1 2 3 4 5; do
            ok=1
            for x in pom pom.sha512 jar jar.sha512; do
              curl -fsSL --retry 4 --retry-delay 15 --retry-all-errors -o "$T/$F.$x" "$B.$x" || ok=0
            done
            if [ "$ok" = 1 ] && [ "$(sha "$T/$F.jar")" = "$(want "$T/$F.jar.sha512")" ] && [ "$(sha "$T/$F.pom")" = "$(want "$T/$F.pom.sha512")" ]; then
              mkdir -p "$D" && mv "$T"/* "$D"/ && echo "Hentet $F" && exit 0
            fi
            echo "Forsøk $n mislyktes – venter litt"; sleep $((n * 30))
          done
          # Ikke stopp her: Robolectric prøver selv under testene, og teststeget under prøver igjen ved nettfeil
          echo "::warning::Fikk ikke hentet $F fra Maven Central på forhånd"

      # Nytt forsøk BARE når det som feilet var nedlasting/nett (429, tidsavbrudd …) – aldri når en test faktisk feiler
      - name: Kjør tester
        run: |
          set -o pipefail   # uten dette ville «| tee» skjult at gradle feilet
          for n in 1 2 3; do
            rm -rf app/build/test-results/testDebugUnitTest
            if gradle testDebugUnitTest --no-daemon 2>&1 | tee "$RUNNER_TEMP/test.log"; then exit 0; fi
            KIND="$(python3 - "$RUNNER_TEMP/test.log" <<'PY'
          import glob, re, sys, xml.etree.ElementTree as ET
          net = re.compile(r"Failed to fetch maven artifact|response code: (429|5\d\d)|status code (429|5\d\d)|Too Many Requests|"
                           r"UnknownHostException|SocketTimeoutException|ConnectException|Connection reset|Premature EOF|SSLException")
          real = netfail = 0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for tc in ET.parse(p).getroot().iter("testcase"):
                  for f in list(tc.iter("failure")) + list(tc.iter("error")):
                      if net.search((f.get("message") or "") + (f.text or "")): netfail += 1
                      else: real += 1
          log = open(sys.argv[1], errors="replace").read()
          gradle_net = re.search(r"Could not (resolve|GET|HEAD|download)|Received status code (429|5\d\d)|Read timed out|Connection reset", log)
          if real: print("test")                     # en ekte testfeil: ikke prøv igjen
          elif netfail or gradle_net: print("net")   # bare nedlasting/nett feilet
          else: print("other")                       # f.eks. kompileringsfeil
          PY
            )"
            if [ "$KIND" != "net" ]; then
              echo "::error title=Testene feilet::Se «Kjør tester» over (og testrapporten under Artifacts)."; exit 1
            fi
            echo "::warning::Nedlasting/nett feilet under testene (forsøk $n) – prøver igjen"; sleep $((n * 60))
          done
          echo "::error title=Nettfeil::Fikk ikke lastet ned det testene trenger etter 3 forsøk (Maven Central). Kjør bygget på nytt senere."; exit 1

      - name: Last opp testrapporten
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: testrapport
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Bygg APK
        # versionCode = 1000 + byggnummer (settes i app/build.gradle.kts fra GITHUB_RUN_NUMBER).
        # Release-bygg: raskere på stereoen og ikke «debuggable»; signert med samme faste nøkkel som før.
        run: gradle assembleRelease --no-daemon

      - name: Gi fila et enkelt navn og lag version.json
        run: |
          cp app/build/outputs/apk/release/app-release.apk bilstereo.apk
          # Må være signert med den faste nøkkelen (ikke utviklersignatur), ellers kan den ikke oppdatere T'OS
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            CERTS="$("$APKSIGNER" verify --print-certs bilstereo.apk)" || { echo "::error::APK-en er ikke gyldig signert"; exit 1; }
            if printf '%s' "$CERTS" | grep -q "Android Debug"; then
              echo "::error::APK-en er signert med utviklernøkkel, ikke den faste T'OS-nøkkelen"; exit 1
            fi
          fi
          VC=$((1000 + GITHUB_RUN_NUMBER))
          VN="$(grep -oP 'else "\K[0-9.]+(?=")' app/build.gradle.kts | head -1 || true).$GITHUB_RUN_NUMBER"
          # Sjekk at APK-en virkelig har dette versjonsnummeret, og bruk versjonsnavnet fra selve APK-en
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1 || true)
          if [ -n "$AAPT" ]; then
            BADGE="$("$AAPT" dump badging bilstereo.apk)"
            printf '%s' "$BADGE" | grep -q "versionCode='$VC'" || { echo "::error::APK har ikke versionCode $VC"; exit 1; }
            APKVN="$(printf '%s' "$BADGE" | grep -oP "versionName='\K[^']+" | head -1 || true)"
            [ -n "$APKVN" ] && VN="$APKVN"
          fi
          # Uten versjonsnavn (f.eks. endret linje i build.gradle.kts) ville stereoen vist «.123» – stopp heller
          case "$VN" in [0-9]*) ;; *) echo "::error::Fant ikke versionName (fikk «$VN»)"; exit 1 ;; esac
          printf '{"versionCode": %d, "versionName": "%s"}\n' "$VC" "$VN" > version.json
          cat version.json

      - name: Last opp som artefakt
        uses: actions/upload-artifact@v6
        with:
          name: bilstereo-apk
          path: bilstereo.apk

      - name: Flytt taggen «latest» til dette bygget
        run: |
          git tag -f latest
          git push -f origin latest

      # Først APK-en, så version.json til slutt – da sier stereoen aldri «ny versjon» før APK-en ligger klar
      - name: Publiser APK på «latest»
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Siste bygg
          make_latest: true
          files: bilstereo.apk
          body: "Nyeste T'OS. Last ned bilstereo.apk og installer på stereoen, eller trykk «Oppdater» i T'OS."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publiser version.json på «latest»
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
