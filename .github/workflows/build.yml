name: Bygg APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bygg debug-APK
        run: gradle assembleDebug --no-daemon

      - name: Gi fila et enkelt navn og lag version.json
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bilstereo.apk
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "{\"versionCode\": $VC, \"versionName\": \"$VN\"}" > version.json
          cat version.json

      - name: Last opp som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: bilstereo-apk
          path: bilstereo.apk

      - name: Publiser som "latest"-release (direkte nedlastingslenke)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Siste bygg
          files: |
            bilstereo.apk
            version.json
          body: "Nyeste APK. Last ned bilstereo.apk og installer på stereoen."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
