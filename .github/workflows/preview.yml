name: Publiser testside

# Legger preview/index.html ut på https://tormod22.github.io/bilstereo-launcher/
# Engangsoppsett: Settings → Pages → Source: «GitHub Actions».
on:
  push:
    branches: [ main ]
    paths: [ "preview/**", ".github/workflows/preview.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Stopper ikke noe annet om GitHub Pages ikke er slått på (Settings → Pages → «GitHub Actions»)
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: preview
      - id: deployment
        uses: actions/deploy-pages@v5
